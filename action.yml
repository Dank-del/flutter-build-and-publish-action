name: 'Flutter Build and Publish APK'
description: 'Build a Flutter Android APK and upload it as a workflow artifact.'
author: 'Sayan Biswas'

branding:
  icon: 'package'
  color: 'blue'

inputs:
  flutter-version:
    description: 'Flutter version to install (e.g. 3.24.3). Leave empty for the latest on the chosen channel.'
    required: false
    default: ''
  flutter-channel:
    description: 'Flutter channel: stable, beta, or master.'
    required: false
    default: 'stable'
  java-version:
    description: 'Java version to set up via Temurin.'
    required: false
    default: '17'
  build-args:
    description: 'Arguments passed to `flutter build`.'
    required: false
    default: 'apk --split-per-abi'
  artifact-name:
    description: 'Name for the uploaded artifact.'
    required: false
    default: 'flutter-apk'
  working-directory:
    description: 'Path to the Flutter project root.'
    required: false
    default: '.'

outputs:
  apk-path:
    description: 'Directory containing the built APKs.'
    value: ${{ steps.build.outputs.apk-path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        java-version: ${{ inputs.java-version }}
        distribution: temurin

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: ${{ inputs.flutter-channel }}
        flutter-version: ${{ inputs.flutter-version }}
        cache: true

    - name: Verify Flutter installation
      shell: bash
      run: flutter doctor -v

    - name: Get packages
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get

    - name: Build
      id: build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        flutter build ${{ inputs.build-args }}
        echo "apk-path=${{ inputs.working-directory }}/build/app/outputs/flutter-apk/" >> "$GITHUB_OUTPUT"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.build.outputs.apk-path }}
